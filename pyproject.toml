[project]
name = "mfg-c2-063"
version = "0.1.0"
description = "ManufacturingEngineeringResearchToTechnicalReportAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# installed from the package registry by the run-tests job in the pipeline definition
# (wheel-only since the CI stub package cutover). Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: the runtime configuration and the
# HITL boundary test read config/config.yaml.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no type information, so every framework base class
# resolves to Any; subclassing it is the template contract, not a typing error.
disallow_subclassing_any = false
# Published sample code is excluded rather than annotated: it is illustrative
# reference material, not part of the runtime.
exclude = ["src/examples/"]

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

# State extends the framework's AgentState TypedDict. That is correct at
# runtime, but the untyped wheel makes AgentState `Any`, so mypy reports every
# field of the subclass as an invalid type. One cause, one override.
[[tool.mypy.overrides]]
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
